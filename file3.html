<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DropShop</title>
  <link rel="stylesheet" href="style3.css">
</head>
<body>

<!-- Navbar -->

<header>
  <div class="header-left">
    <h1>DropShop</h1>
    <span class="tagline">Your one-stop online shop!</span>
  </div>
  <nav>
    <input type="text" id="search" placeholder="Search products...">
    <button onclick="searchProduct()">Search</button>
    <select id="category-filter" onchange="filterCategory()">
      <option value="all">All Categories</option>
      <option value="Electronics">Electronics</option>
      <option value="Fashion">Fashion</option>
      <option value="Accessories">Accessories</option>
    </select>
    <button id="cart-btn" onclick="openCartModal()">🛒 Cart (<span id="cart-count">0</span>)</button>
  </nav>
</header>


<!-- Products -->
<main>
  <section class="products" id="product-list"></section>
</main>

<!-- Cart Modal -->
<div id="cart-modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeCartModal()">&times;</span>
    <h2>Your Cart</h2>
    <ul id="cart-items"></ul>
    <h3>Total: ₹<span id="total">0</span></h3>
    <button onclick="checkout()" id="checkout-btn">Checkout</button>
  </div>
</div>

<script src="script3.js"></script>
</body>
</html>
